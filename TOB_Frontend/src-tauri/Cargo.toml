[package]
name = "tob-frontend"
version = "0.1.0"
description = "火炬之光：无限 构建器"
edition = "2021"

[lib]
name = "tob_frontend_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
